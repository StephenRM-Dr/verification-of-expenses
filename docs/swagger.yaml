  /api/whatsapp/logout:
    post:
      description: Desvincula de manera remota el dispositivo y levanta de forma asíncrona
        una nueva rutina para refrescar las llaves criptográficas y servir un QR limpio.
      produces:
      - application/json
      responses:
        "200":
          description: 'Confirmación de reinicio de credenciales: {''status'': ''resetting''}'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cerrar sesión de WhatsApp y regenerar QR
      tags:
      - whatsapp
  /api/whatsapp/send:
    post:
      description: Encola de forma asíncrona y segura el envío estructurado de un
        reporte hacia un canal o grupo de WhatsApp parametrizado. Evita duplicados
        simultáneos.
      parameters:
      - description: ID único de la transacción a reportar
        in: query
        name: id
        required: true
        type: integer
      - description: 'Nombre o JID del destinatario (Por defecto: ''Prueba'')'
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'Estado de la transacción en cola: ''queued'' o ''processing'''
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Transacción o Grupo objetivo no encontrado
          schema:
            type: string
        "503":
          description: El cliente de WhatsApp no se encuentra inicializado o conectado
          schema:
            type: string
      summary: Reportar transacción a WhatsApp
      tags:
      - whatsapp
  /api/whatsapp/status:
    get:
      description: Devuelve el estado actual del puente de comunicación, errores persistentes,
        cadenas QR activas para emparejamiento o el listado de grupos vinculados.
      produces:
      - application/json
      responses:
        "200":
          description: Estructura del estado del cliente y grupos vinculados
          schema:
            additionalProperties: true
            type: object
      summary: Estado de WhatsApp Multi-Device
      tags:
      - whatsapp
swagger: "2.0"
