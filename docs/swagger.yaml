basePath: /
definitions:
  models.Transaccion:
    properties:
      banco_usado:
        type: string
      ciudad:
        type: string
      descripcion:
        type: string
      fecha_pago:
        type: string
      id:
        type: integer
      imagen_path:
        type: string
      monto:
        type: number
      referencia:
        type: string
    type: object
host: api.example.com
info:
  contact: {}
  description: Backend escalable en Go para control financiero y automatización de
    reportes a WhatsApp.
  title: Braille Web - API de Transacciones y Reportes
  version: "1.0"
paths:
  /api/export:
    get:
      description: Sincroniza y descarga una sábana de datos procesada en formato
        binario legible por Microsoft Excel o plataformas externas de contabilidad.
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: Descarga de archivo reporte_brailer.xlsx
          schema:
            type: file
        "500":
          description: Error al construir dinámicamente la estructura Excel
          schema:
            type: string
      summary: Exportar historial de transacciones a Excel (.xlsx)
      tags:
      - export
  /api/summary:
    get:
      description: Calcula el balance acumulado general, los gastos del mes corriente
        en base a la fecha actual y la cantidad de transacciones registradas.
      produces:
      - application/json
      responses:
        "200":
          description: 'Ejemplo: {''total_general'': 5000.5, ''total_mes'': 1200.0,
            ''conteo'': 14}'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Error de servidor al calcular la lista
          schema:
            type: string
      summary: Obtener resumen analítico
      tags:
      - metrics
  /api/transactions:
    delete:
      consumes:
      - application/json
      - multipart/form-data
      description: Permite Listar (GET), Crear (POST), Editar (PUT) usando multipart/form-data
