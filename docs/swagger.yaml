        in: query
        name: id
        type: integer
      - description: ID de la transacción (Requerido solo para PUT con FormData)
        in: formData
        name: id
        type: integer
      - description: Fecha de pago (DD/MM/YYYY)
        in: formData
        name: fecha_pago
        type: string
      - description: Descripción o concepto del gasto
        in: formData
        name: descripcion
        type: string
      - description: Monto financiero de la operación
        in: formData
        name: monto
