basePath: /
definitions:
  models.Transaccion:
    properties:
      banco_usado:
        type: string
      ciudad:
        type: string
      descripcion:
        type: string
      fecha_pago:
        type: string
      id:
        type: integer
      imagen_path:
        type: string
      monto:
        type: number
      referencia:
        type: string
    type: object
host: api.example.com
info:
  contact: {}
  description: Go backend for expense tracking, receipt storage, Excel reporting and
    WhatsApp notifications.
  title: Verification of Expenses - Transactions & Reports API
  version: "1.0"
paths:
  /api/export:
    get:
      description: Downloads the full transaction history as an Excel workbook.
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: Excel file download
          schema:
            type: file
        "500":
          description: Error while building the Excel workbook
          schema:
            type: string
      summary: Export transactions to Excel (.xlsx)
      tags:
      - export
  /api/summary:
    get:
      description: Returns the overall total, the current month's total and the number
        of recorded transactions.
      produces:
      - application/json
      responses:
        "200":
          description: 'Example: {''total_general'': 5000.5, ''total_mes'': 1200.0,
            ''conteo'': 14}'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error while computing the summary
          schema:
            type: string
      summary: Get summary metrics
      tags:
      - metrics
  /api/transactions:
    delete:
      consumes:
      - application/json
      - multipart/form-data
      description: List (GET), create (POST), update (PUT) and delete (DELETE) financial
        transactions, using multipart/form-data or JSON.
      parameters:
      - description: Transaction ID (required only for DELETE)
        in: query
        name: id
        type: integer
      - description: Transaction ID (required only for PUT with form data)
        in: formData
        name: id
        type: integer
      - description: Payment date (DD/MM/YYYY)
        in: formData
        name: fecha_pago
        type: string
      - description: Description of the expense
        in: formData
        name: descripcion
        type: string
      - description: Transaction amount
        in: formData
        name: monto
        type: number
      - description: City of the transaction
        in: formData
        name: ciudad
        type: string
      - description: Bank used
        in: formData
        name: banco_usado
        type: string
      - description: Bank reference number
        in: formData
        name: referencia
        type: string
      - description: Existing image path, kept if no new file is uploaded
        in: formData
        name: imagen_path
        type: string
      - description: Receipt image file
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Success (GET returns the list, PUT confirms the update)
          schema:
            items:
              $ref: '#/definitions/models.Transaccion'
            type: array
        "201":
          description: Transaction created (POST)
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input
          schema:
            type: string
        "500":
          description: Internal database error
          schema:
            type: string
      summary: Manage transactions (CRUD)
      tags:
      - transactions
