  /api/whatsapp/logout:
    post:
      description: Unlinks the device and asynchronously starts a fresh pairing flow
        that serves a new QR code.
      produces:
      - application/json
      responses:
        "200":
          description: 'Credentials reset confirmation: {''status'': ''resetting''}'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log out of WhatsApp and regenerate the QR code
      tags:
      - whatsapp
  /api/whatsapp/send:
    post:
      description: Asynchronously queues a structured report to a WhatsApp group or
        contact, preventing concurrent duplicate sends.
      parameters:
      - description: ID of the transaction to send
        in: query
        name: id
        required: true
        type: integer
      - description: 'Recipient group name or JID (default: ''Prueba'')'
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'Queue state of the send: ''queued'' or ''processing'''
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Transaction or target group not found
          schema:
            type: string
        "503":
          description: WhatsApp client is not initialized or connected
          schema:
            type: string
      summary: Send a transaction to WhatsApp
      tags:
      - whatsapp
  /api/whatsapp/status:
    get:
      description: Returns the current connection state, any persistent error, the
        active pairing QR code, or the list of joined groups.
      produces:
      - application/json
      responses:
        "200":
          description: Client state and joined groups
          schema:
            additionalProperties: true
            type: object
      summary: WhatsApp connection status
      tags:
      - whatsapp
swagger: "2.0"
