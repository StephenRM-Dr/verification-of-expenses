<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="900" height="340" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="30" y="120" width="150" height="100" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="105" y="160" text-anchor="middle" font-size="16" font-weight="600" fill="#0c4a6e">Client</text>
  <text x="105" y="182" text-anchor="middle" font-size="12" fill="#0c4a6e">Web / mobile app</text>
  <text x="105" y="200" text-anchor="middle" font-size="12" fill="#0c4a6e">or CLI menu</text>

  <rect x="260" y="80" width="200" height="180" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="360" y="112" text-anchor="middle" font-size="16" font-weight="600" fill="#14532d">Go backend</text>
  <text x="360" y="140" text-anchor="middle" font-size="12" fill="#14532d">REST API + Swagger UI</text>
  <text x="360" y="162" text-anchor="middle" font-size="12" fill="#14532d">Transaction CRUD</text>
  <text x="360" y="184" text-anchor="middle" font-size="12" fill="#14532d">Summary metrics</text>
  <text x="360" y="206" text-anchor="middle" font-size="12" fill="#14532d">Excel export (excelize)</text>
  <text x="360" y="228" text-anchor="middle" font-size="12" fill="#14532d">WhatsApp bridge (whatsmeow)</text>

  <rect x="580" y="30" width="290" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="725" y="65" text-anchor="middle" font-size="16" font-weight="600" fill="#4c1d95">PostgreSQL</text>
  <text x="725" y="88" text-anchor="middle" font-size="12" fill="#4c1d95">Transactions + WhatsApp session</text>

  <rect x="580" y="130" width="290" height="80" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="725" y="165" text-anchor="middle" font-size="16" font-weight="600" fill="#78350f">S3-compatible storage</text>
  <text x="725" y="188" text-anchor="middle" font-size="12" fill="#78350f">Receipt images (local-disk fallback)</text>

  <rect x="580" y="230" width="290" height="80" rx="10" fill="#fce7f3" stroke="#db2777"/>
  <text x="725" y="265" text-anchor="middle" font-size="16" font-weight="600" fill="#831843">WhatsApp</text>
  <text x="725" y="288" text-anchor="middle" font-size="12" fill="#831843">Transaction reports to groups</text>

  <g stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a)" marker-start="url(#a)">
    <line x1="180" y1="170" x2="258" y2="170"/>
    <line x1="460" y1="130" x2="578" y2="72"/>
    <line x1="460" y1="170" x2="578" y2="170"/>
    <line x1="460" y1="210" x2="578" y2="268"/>
  </g>
